server {
  listen 80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name worklog.odds.team;

  ssl_certificate /etc/letsencrypt/live/worklog.odds.team/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/worklog.odds.team/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  
  location / {
    root /app/dist/odds-worklog;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }
}
