on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

name: CI/CD Project Worklog Web Dev ODDS Cloud

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: dev-odds-cloud

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm i --force

      - name: Run web unit test
        run: npm run test:ci

      - name: Analyze with SonarCloud
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push image to GHCR
        id: build-image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker build --build-arg ANGULAR_ENV=develop -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH Shell Command
        uses: fifsky/ssh-action@master
        with:
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/ubuntu/worklog
            docker compose pull
            docker compose down
            docker compose up -d
          host: ${{ vars.ODDS_CLOUD_DEV_HOST }}
          user: ubuntu
          key: ${{ secrets.ODDS_CLOUD_DEV_PRIVATE_KEY}}
