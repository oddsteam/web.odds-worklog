<div>
  <div class="card-container">
    <h5 class="mt-2 ml-2">Reminder</h5>
    <form [formGroup]="fg">
      <div class="row mt-2">
        <div class="col-2 d-flex justify-content-end">
          Date:
        </div>
        <div class="col-2">
          <input type="text" id="date" formControlName="date">
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-2 d-flex justify-content-end">
          Message:
        </div>
        <div class="col-2">
          <textarea name="message" id="message" cols="30" rows="3" formControlName="message"></textarea>
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-2 d-flex justify-content-end">
          Time:
        </div>
        <div class="col-2 d-flex justify-content-start">
          <input type="text" id="time" formControlName="time" class="disable-color">
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-2 d-flex justify-content-end">
          Channel
        </div>
        <div class="col-3">
          <div class="card d-flex justify-content-start">
            <div *ngFor="let channel of channelList" class="ml-2">
              <input type="checkbox" formControlName="channel" [(ngModel)]="channel.value" (change)="checkBoxEvent(channel.name, channel.value)"
                [id]="'channel' + channel.name"> {{channel.name}}
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-3 mb-3 mr-1">
        <div class="col-12 d-flex justify-content-end">
          <button id="submitButton" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </form>
  </div>
</div>
