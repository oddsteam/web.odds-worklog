<div class="wrapper">
  <div class="col-lg-4 col-md-6 mx-auto">
    <div *ngIf="keycloakJwtToken">
      {{ keycloakJwtToken }}
    </div>
    <div class="card rounded-0 shadow">
      <div class="text-center pt-3">
        <img class="logo" src="assets/images/odds_logo.png" />
      </div>
      <div class="d-flex flex-column align-items-center p-3">
        <div class="form-group text-center">
          <button class="btn btn-primary" style="width: auto;" (click)="loginWithKeycloak()">
            <i class="fas fa-key me-2"></i>Login with Keycloak
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
