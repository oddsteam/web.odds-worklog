<div>
  <div *ngIf="showMessage">
    <app-message-tooltip></app-message-tooltip>
  </div>
  <div class="d-flex justify-content-between pb-2 px-2">
    <div class="d-flex align-items-end">
      <h5 class="mt-2 ml-2">Product Owner</h5>
    </div>
    <div>
      <button class="btn btn-blue" type="button" (click)="onAddData()">เพิ่มข้อมูล</button>
    </div>
  </div>
  <div class="">
    <table class="table">
      <thead>
        <th class="text-left">ชื่อ</th>
        <th>จำนวน</th>
        <th></th>
      </thead>
      <tbody *ngIf="productOwner?.length !== 0">
        <tr *ngFor="let productOwner of productOwner">
          <td>
            <a class="link" href="javascript:void(0)" (click)="goToInvoicePage(productOwner?.id)">{{productOwner?.name}}</a>
          </td>
          <td>{{productOwner?.amount}}</td>
          <td>
            <a class="edit-link" href="javascript:void(0)" (click)="onEditProductOwner()">Edit</a>
            <span class="d-mark">|</span>
            <a class="edit-link" href="javascript:void(0)" (click)="onDeleteProductOwner(productOwner?.id)">Delete</a>
          </td>
        </tr>
      </tbody>
      <tbody *ngIf="productOwner?.length === 0">
        <tr>
          <td colspan="100%" class="text-center text-danger">
            ยังไม่มีข้อมูล
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #templateModal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">เพิ่มข้อมูล Product Owner</h4>
    <button type="button" class="close btn-close" aria-label="Close" (click)="closeModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body mx-sm-5">
    <form [formGroup]="formGroupProductOw">
      <div class="form-group my-2">
        <label>PO No. : </label>
        <input id="name" type="text" class="form-control" formControlName="name">
      </div>
      <div class="form-group">
        <label>Amount :</label>
        <input id="amount" type="text" class="form-control text-right" formControlName="amount">
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button id="btn-submit" type="button" class="btn btn-blue" (click)="onSubmit()">Submit</button>
  </div>
</ng-template>
