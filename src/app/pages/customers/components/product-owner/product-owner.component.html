<div>
    <div class="d-flex justify-content-between pb-2 px-2">
      <div class="d-flex align-items-end">
        <h5 class="mt-2 ml-2">Product Owner</h5>
      </div>
      <div>
      <button class="btn btn-blue" type="button" (click)="onAddData()">เพิ่มข้อมูล</button>
      </div>
    </div>
    <div class="">
       <table class="table">
         <thead>
           <th class="text-left">ชื่อ</th>
           <th>Amount</th>
         </thead>
         <tbody>
           <tr >
             <td>
               <a class="link"  href="javascript:void(0)" (click)="goToInvoicePage()">1111</a>
             </td>
             <td>2222</td>
           </tr>
         </tbody>
       </table>
    </div>
  </div>

  <ng-template #templateModal>
    <div class="modal-header">
      <h4 class="modal-title" id="modal-basic-title">เพิ่มข้อมูล Product Owner</h4>
      <button type="button" class="close btn-close" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body mx-sm-5">
      <form [formGroup]="fg">
        <div class="form-group my-2">
          <label>ID : </label>
          <input id="id" type="text"  class="form-control text-right" formControlName="id">
        </div>
        <div class="form-group">
          <label>Amount :</label>
          <input id="amount" type="text" class="form-control text-right" formControlName="amount" (keyup)="inputAmount()">
        </div> 
      </form>
    </div>
    <div class="modal-footer">
        <button id="btn-submit" type="button" class="btn btn-blue" (click)="onSubmit()" [disabled]="disableButton()">Submit</button>
    </div>
  </ng-template>
