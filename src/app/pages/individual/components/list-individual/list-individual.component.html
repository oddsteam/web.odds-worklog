<div>
  <div class="d-flex justify-content-between pb-3 px-3" *ngIf="role === 'admin'">
    <div class="d-flex align-items-end">
      <h2 class="mb-0">{{ date | date: 'MMMM yyyy'}}</h2>
    </div>
    <div class="row col-7 d-flex justify-content-end">
      <button class="col rounded export-container" style="margin-right: 10px" (click)="exportDifferentIndividuals()">
        <a href="javascript:void(0)">
          <i class="fas fa-download"></i>
          Export Different Individuals
        </a>
      </button>
      <button class="col-4 rounded export-container" style="margin-right: 10px" (click)="exportIndividual('1')">
        <a href="javascript:void(0)">
          <i class="fas fa-download"></i>
          Export ย้อนหลัง 1 เดือน
        </a>
      </button>
      <button class="rounded export-container">
        <a href="javascript:void(0)" (click)="exportIndividual('0')">
          <i class="fas fa-download"></i>
          Export
        </a>
      </button>
    </div>
  </div>
  <app-table-list [ListData]="listIncomeIndividual"></app-table-list>
</div>
