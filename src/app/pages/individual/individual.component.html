<div *ngIf="isShowData()">
  <div class="card-container" *ngIf="personType === 'individual'">
    <app-add-income [role]="personType" (addIncomeAlready)="addIncomeEmit($event)"></app-add-income>
  </div>
  <div>
    <app-list-individual [role]="personType" [isUpdateList]="isUpdateIncome"></app-list-individual>
  </div>
</div>
