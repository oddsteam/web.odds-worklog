<div>
  <div class="d-flex justify-content-between pb-3 px-3">
    <div class="d-flex align-items-end">
      <h2 class="mb-0">{{ date | date: 'MMMM yyyy'}}</h2>
    </div>
    <div class="row col-7 d-flex justify-content-end">
      <button class="rounded export-container" (click)="exportCorporate()">
        <a href="javascript:void(0)">
          <i class="fas fa-download"></i>
          Export
        </a>
      </button>
      <button class="rounded export-container ml-4" (click)="exportPdf()">
        <a href="javascript:void(0)" style="font-size: 12px">
          <i class="fas fa-download"></i>
          Export Pdf
        </a>
      </button>
    </div>
  </div>
  <app-table-list [ListData]="listIncome"></app-table-list>
</div>
