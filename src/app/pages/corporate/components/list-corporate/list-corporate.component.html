<div>
  <div class="d-flex justify-content-between pb-3 px-3" *ngIf="showIncomeExport">
    <div class="d-flex align-items-end">
      <h2 class="mb-0">{{ date | date: 'MMMM yyyy'}}</h2>
    </div>
    <div class="row col-7 d-flex text-end">
      <div class="dropdown">
        <button class="rounded export-container"><a href="javascript:void(0)">Export</a> <i
            class="fa fa-caret-down"></i> </button>
        <div class="dropdown-content">
          <a href="javascript:void(0)" (click)="exportCorporate('0')">Export เดือนปัจจุบัน</a>
          <a href="javascript:void(0)" (click)="exportCorporate('1')">Export ย้อนหลัง 1 เดือน</a>
          <a href="javascript:void(0)" (click)="exportByMonth()">Export แบบระบุเดือน</a>
        </div>
      </div>

    </div>
  </div>
  <app-table-list [ListData]="listIncome"></app-table-list>
</div>
