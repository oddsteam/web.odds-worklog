<div *ngIf="isShowData()">
  <div class="card-container" *ngIf="personType !== 'admin'">
    <app-add-income [role]="personType" (addIncomeAlready)="addIncomeEmit($event)"></app-add-income>
  </div>
  <div>
    <app-list-corporate [role]="personType" [isUpdateList]="isUpdateIncome"></app-list-corporate>
  </div>
</div>
