<h5 class="pl-4">History</h5>

<div class="d-flex p-3">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr class="tr-hidden">
          <th class="text-left align-middle">Month</th>
          <th class="text-center align-middle">รายได้ปกติ</th>
          <th class="text-center align-middle">รายได้พิเศษ</th>
          <th class="text-center align-middle" *ngIf="!isNoIndividual">Vat 7%</th>
          <th class="text-center align-middle">Wht 3%</th>
          <th class="text-center align-middle">รายได้สุทธิ</th>
        </tr>
      </thead>
      <tbody *ngIf="isNoData">
        <tr *ngFor="let item of incomeResponse ">
          <td class="text-left">{{ checkValue(item.lastUpdate | date:'MMMM')}}</td>
          <td class="text-center">{{ checkValue(item.netIncome) }}</td>
          <td class="text-center">{{ checkValue(item.netSpecialIncome) }}</td>
          <td class="text-center" *ngIf="!isNoIndividual">{{ checkValue(item.vat) }}</td>
          <td class="text-center">{{ checkValue(item.wht) }}</td>
          <td class="text-center">{{ checkValue(item.totalIncome) }}</td>
        </tr>
      </tbody>
      <tbody *ngIf="!isNoData">
        <tr>
          <td class="text-center" colspan="5">No data.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
