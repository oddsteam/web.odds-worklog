<div class="row d-flex" *ngIf="checkPath()">
  <div class="card col-auto my-3 mx-3" *ngFor="let site of sites; let i = index" (click)="gotoUserListSite(site.users,site.name)">
    <div class="card-body text-center">
      <span class="card-title link-text">{{ site.name }}</span>
      <p class="card-text">Total : {{ site.length }}</p>
    </div>
  </div>
</div>
<div *ngIf="!checkPath()">
  <app-table-list-user-by-site></app-table-list-user-by-site>
</div>
