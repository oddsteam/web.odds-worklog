<div class="row d-flex" *ngIf="checkPath()">
  <div class="w-100 d-flex justify-content-end mb-3 px-3">
    <button type="button" class="btn btn-primary" (click)="addSite()">Add site</button>
  </div>
  <div class="d-flex flex-row flex-wrap justify-content-center">
    <div class="card site-item col-lg-4 col-md-4 col-sm-6 mx-3 mb-3" *ngFor="let site of sites; let i = index" (click)="gotoUserListSite(site.users,site.name)">
      <div class="card-body text-center">
        <div class="site-actions">
          <a href="javascript:void(0)" class="p-2" (click)="editSite($event, site)" title="Edit"><i class="fa fa-pencil"></i></a>
          <a href="javascript:void(0)" class="p-2" (click)="deleteSite($event, site)" title="Delete"><i class="fa fa-trash"></i></a>
        </div>
        <span class="card-title link-text">{{ site.name }}</span>
        <p class="card-text">Total : {{ site.length }}</p>
      </div>
    </div>
  </div>
</div>
<div *ngIf="!checkPath()">
  <app-table-list-user-by-site></app-table-list-user-by-site>
</div>
