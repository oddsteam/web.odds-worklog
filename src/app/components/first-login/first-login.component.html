<div class="container py-5">
    <div class="col-md-6 mx-auto">
      <div class="card rounded-0">
        <div class="card-header">
            <h3 class="mb-0" >Login With Google</h3>
        </div>
        <div class="card-body">
            <div class="ui form segment">   
                <div class="two fields">
                  <div class="field">
                    <label for="GivenName">Given Name</label>
                    <input id="GivenName" placeholder="Given Name" type="text" />
                  </div>
            
                  <div class="field">
                    <label for="Surname">Surname</label>
                    <input id="Surname" placeholder="Surname" type="text">
                  </div>
                </div>
            
                <div class="field">
                  <label for="Email">Email</label>
                  <input id="Email" placeholder="Email" type="text">
                </div>
            
                <div class="field">
                  <label for="Username">Username</label>
                  <input id="Username" placeholder="Username" type="text">
                </div>
            
                <div class="field">
                  <label for="Password">Password</label>
                  <input id="Password" type="password">
                </div>
            
                <div class="field">
                  <label for="PasswordConfirm">Password Confirm</label>
                  <input id="PasswordConfirm" type="password">
                </div>
            <div class="col-md-6 mx-auto">
              <button   type="button" class="btn btn-green row" >Save</button>             
              <button   type="button" class="btn btn-green" >Cancel</button>             
            </div>
      </div>
    </div>
</div>
