<div class="d-flex">
  <div class="d-flex profile">
    <img [src]="imageProfile" *ngIf="imageProfile">
    <i class="fa fa-user-circle fa-3x me-2" aria-hidden="true" *ngIf="!imageProfile"></i>
    <span>{{ name }}</span>
  </div>
  <div class="text-end">
    <a class="link" href="javascript:void(0)" (click)="logout()"> LOGOUT
      <i class="fa fa-sign-out-alt ms-1" aria-hidden="true"></i></a>
  </div>
</div>
<hr />
