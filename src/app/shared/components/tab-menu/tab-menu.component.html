<div>
  <img src="assets/images/odds_logo_white.png">
</div>
<ul class="tab-without-padding">
 <ng-container *ngFor="let tabMenu of listTabMenuShow">
  <li [ngClass]="{'active' : personType === tabMenu?.id }" >
      <a class="d-flex align-items-center" (click)="routerTo(tabMenu?.id)" [style.padding-left]="tabMenu?.level * 1 + 'rem'">
        <i class="fa pl-4" [ngClass]="tabMenu?.icon"></i>
        <span class="px-2">{{tabMenu?.text}}</span>
      </a>
    </li>
</ng-container>
</ul>
