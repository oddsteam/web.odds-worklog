<div>
  <img src="assets/images/odds_logo_white.png">
</div>
<ul class="tab-without-padding"  [ngClass]="{ 'display-gray-row-none': isShowLess }">
 <ng-container *ngFor="let tabMenu of listTabMenuShow">
  <li [ngClass]="{'active' : personType === tabMenu?.id,'background-dark-gray' : tabMenu?.level === 1}" 
      (click)="routerTo(tabMenu?.id)"
      > 
      <div class="d-flex align-items-center justify-content-between">
        <a class="d-flex align-items-center" [style.padding-left]="tabMenu?.level * 1 + 'rem'">
          <i class="fa pl-4" [ngClass]="tabMenu?.icon"></i>
          <span class="px-2">{{tabMenu?.text}}</span>
        </a>
        <span class="text-right" *ngIf="tabMenu?.id === 'management' && isShowLess">
          <i class="fa fa-angle-right"></i>
        </span>
        <span class="text-right" *ngIf="tabMenu?.id === 'management' && !isShowLess">
          <i class="fa fa-angle-down"></i>
        </span>
      </div>
    </li>
</ng-container>
</ul>
