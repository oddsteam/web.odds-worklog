<div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Add Income</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body mx-sm-5">
    <div class="py-3 bg-color">
        <span><strong>ตัวอย่าง</strong></span><br>
        <span>: น้อง A ทำงานได้เงินวันละ 100 บาท ทำงาน 20 วัน กรอก "2000" นะ</span>
    </div>
    <div class="form-group my-2">
      <label>รายได้ :</label>
      <input type="number" style="text-align:right" class="form-control" (input)="inputIncomeAmount($event.target.value)">
    </div>
    <div class="form-group">
      <label>บันทึก :</label>
      <textarea type="text" class="form-control"></textarea>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="disibleButton()">Submit</button>
  </div>
